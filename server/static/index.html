<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Positionslogger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; }
  #side {
    width: 300px; padding: 14px; overflow-y: auto;
    background: Canvas; color: CanvasText; border-left: 1px solid #8884;
  }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  select, input, button { width: 100%; padding: 7px; font: inherit; }
  button { cursor: pointer; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .muted { color: #8889; }
  .stat { margin: 3px 0; }
  .stat b { display: inline-block; min-width: 84px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .on { background: #16a34a; } .off { background: #9ca3af; }
  #side.collapsed { display: none; }
  #toggle {
    position: absolute; z-index: 1000; top: 10px; right: 10px; width: auto;
    padding: 6px 10px; background: Canvas; border: 1px solid #8886; border-radius: 6px;
  }
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #side { width: 100%; height: 45%; border-left: none; border-top: 1px solid #8884; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <button id="toggle" title="Vis/skjul panel">&#9776;</button>
  <div id="side">
    <h1>Positionslogger</h1>

    <label for="device">Enhed</label>
    <select id="device"></select>

    <label for="range">Tidsrum</label>
    <select id="range">
      <option value="1">Sidste time</option>
      <option value="6">Sidste 6 timer</option>
      <option value="24" selected>Sidste d&oslash;gn</option>
      <option value="168">Sidste uge</option>
      <option value="0">Alt</option>
    </select>

    <div class="row">
      <label><input type="checkbox" id="follow" checked style="width:auto"> F&oslash;lg</label>
      <label><input type="checkbox" id="live" checked style="width:auto"> Live</label>
    </div>

    <button id="refresh">Opdater nu</button>
    <button id="fit">Zoom til rute</button>

    <hr style="margin:14px 0; border:none; border-top:1px solid #8884">
    <div id="status"><span class="dot off"></span><span class="muted">forbinder&hellip;</span></div>
    <div class="stat"><b>Sidst set</b><span id="s-age">&ndash;</span></div>
    <div class="stat"><b>Position</b><span id="s-pos">&ndash;</span></div>
    <div class="stat"><b>N&oslash;jagtighed</b><span id="s-acc">&ndash;</span></div>
    <div class="stat"><b>Fart</b><span id="s-spd">&ndash;</span></div>
    <div class="stat"><b>H&oslash;jde</b><span id="s-alt">&ndash;</span></div>
    <div class="stat"><b>Batteri</b><span id="s-bat">&ndash;</span></div>
    <div class="stat"><b>Punkter</b><span id="s-cnt">&ndash;</span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// view-token kan gives i URL'en:  /?token=xxxx
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const q = (extra) => {
  const p = new URLSearchParams(extra || {});
  if (TOKEN) p.set("token", TOKEN);
  const s = p.toString();
  return s ? "?" + s : "";
};

const map = L.map("map").setView([56.0, 10.5], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap-bidragydere",
}).addTo(map);

const track = L.polyline([], { color: "#2563eb", weight: 4, opacity: 0.85 }).addTo(map);
let curMarker = null, curCircle = null, startMarker = null;
let points = [];              // {lat,lon,ts,acc,alt,spd,brg,bat,device_id}
let currentDevice = null;
let ws = null;

const el = (id) => document.getElementById(id);
const fmtAge = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + " s siden";
  if (s < 3600) return Math.round(s / 60) + " min siden";
  if (s < 86400) return (s / 3600).toFixed(1) + " t siden";
  return (s / 86400).toFixed(1) + " dage siden";
};

function setStatus(ok, text) {
  el("status").innerHTML =
    `<span class="dot ${ok ? "on" : "off"}"></span><span class="muted">${text}</span>`;
}

function redraw() {
  const latlngs = points.map((p) => [p.lat, p.lon]);
  track.setLatLngs(latlngs);

  if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
  if (latlngs.length > 1) {
    startMarker = L.circleMarker(latlngs[0], {
      radius: 6, color: "#16a34a", fillColor: "#16a34a", fillOpacity: 1,
    }).addTo(map).bindTooltip("Start");
  }

  const last = points[points.length - 1];
  if (!last) return;

  const ll = [last.lat, last.lon];
  if (!curMarker) {
    curMarker = L.marker(ll).addTo(map);
    curCircle = L.circle(ll, { radius: last.acc || 0, color: "#2563eb", weight: 1, fillOpacity: 0.1 }).addTo(map);
  } else {
    curMarker.setLatLng(ll);
    curCircle.setLatLng(ll).setRadius(last.acc || 0);
  }
  curMarker.bindTooltip(`${last.device_id}<br>${new Date(last.ts).toLocaleString("da-DK")}`);

  el("s-age").textContent = fmtAge(last.ts);
  el("s-pos").textContent = `${last.lat.toFixed(5)}, ${last.lon.toFixed(5)}`;
  el("s-acc").textContent = last.acc != null ? `± ${last.acc.toFixed(0)} m` : "–";
  el("s-spd").textContent = last.spd != null ? `${(last.spd * 3.6).toFixed(1)} km/t` : "–";
  el("s-alt").textContent = last.alt != null ? `${last.alt.toFixed(0)} m` : "–";
  el("s-bat").textContent = last.bat != null ? `${last.bat} %` : "–";
  el("s-cnt").textContent = points.length;

  if (el("follow").checked) map.panTo(ll);
}

function fitTrack() {
  if (points.length) map.fitBounds(track.getBounds(), { padding: [40, 40] });
}

function sinceParam() {
  const hours = Number(el("range").value);
  if (!hours) return {};
  return { since: new Date(Date.now() - hours * 3600e3).toISOString() };
}

async function loadDevices() {
  const r = await fetch("/api/devices" + q());
  if (!r.ok) { setStatus(false, "kan ikke hente enheder (" + r.status + ")"); return; }
  const list = await r.json();
  const sel = el("device");
  const prev = sel.value;
  sel.innerHTML = "";
  for (const d of list) {
    const o = document.createElement("option");
    o.value = d.device_id;
    o.textContent = `${d.device_id} (${d.points})`;
    sel.appendChild(o);
  }
  if (list.length) {
    sel.value = list.some((d) => d.device_id === prev) ? prev : list[0].device_id;
    currentDevice = sel.value;
  }
}

async function loadHistory() {
  if (!currentDevice) return;
  const r = await fetch("/api/positions" + q({ device: currentDevice, limit: 50000, ...sinceParam() }));
  if (!r.ok) { setStatus(false, "kan ikke hente historik (" + r.status + ")"); return; }
  points = await r.json();
  redraw();
  fitTrack();
  setStatus(true, el("live").checked ? "live" : "opdateret " + new Date().toLocaleTimeString("da-DK"));
}

function connectWs() {
  if (ws) { try { ws.close(); } catch (e) {} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws${q()}`);
  ws.onopen = () => setStatus(true, "live");
  ws.onclose = () => { setStatus(false, "afbrudt – prøver igen…"); if (el("live").checked) setTimeout(connectWs, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    if (!el("live").checked) return;
    const m = JSON.parse(ev.data);
    if (m.type !== "position" || m.device_id !== currentDevice) return;
    points.push(m);
    // hold historik-vinduet nogenlunde i sync med valgt tidsrum
    const hours = Number(el("range").value);
    if (hours) {
      const cutoff = Date.now() - hours * 3600e3;
      points = points.filter((p) => new Date(p.ts).getTime() >= cutoff);
    }
    redraw();
  };
}

el("device").addEventListener("change", (e) => { currentDevice = e.target.value; loadHistory(); });
el("range").addEventListener("change", loadHistory);
el("refresh").addEventListener("click", async () => { await loadDevices(); await loadHistory(); });
el("fit").addEventListener("click", fitTrack);
el("live").addEventListener("change", (e) => {
  if (e.target.checked) { connectWs(); loadHistory(); }
  else if (ws) ws.close();
});
el("toggle").addEventListener("click", () => {
  el("side").classList.toggle("collapsed");
  setTimeout(() => map.invalidateSize(), 200);
});

(async function start() {
  await loadDevices();
  await loadHistory();
  connectWs();
  // fallback-poll hvis WebSocket skulle svigte
  setInterval(() => { if (!ws || ws.readyState !== 1) loadHistory(); }, 20000);
})();
</script>
</body>
</html>
